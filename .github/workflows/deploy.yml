name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests (in practice: Dependabot's dependency updates) run the whole
  # gate — unit tests, build, all three browser suites — but never deploy.
  pull_request:
    branches: [main]
  # Every four hours: refresh the satellite data.  The site serves its own copy
  # of CelesTrak's lists (data/ — tools/fetch-data.mjs), so visitors' browsers
  # never contact CelesTrak; this run is what keeps that copy current.  It
  # rebuilds and re-tests the site with the new data and publishes it — no
  # commit is made.  If CelesTrak does not deliver, the run fails and the site
  # keeps the data it has.  (GitHub pauses schedules in a repository with no
  # commits for 60 days; the twice-weekly launch-data commits keep it awake.)
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

# Let the workflow publish Pages and mint the deployment's OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time.  cancel-in-progress MUST be false (this matches GitHub's
# own Pages starter workflow): cancelling a Pages *deployment* mid-flight leaves
# the deployment record in a bad state, which makes the NEXT run fail at the
# deploy-pages step with "Deployment failed, try again later."  A newer push
# waits for the in-flight one to finish instead of killing it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      attention: ${{ steps.data.outputs.attention }}
    timeout-minutes: 20   # install, data fetch (up to ~8 min if a source is slow), unit tests, build; anything past this is a hang
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # match the npm major that writes package-lock.json (npm 11 optionals choke npm 10)
          cache: npm
      - run: npm ci
      # The satellite data this build will publish, into public/data/ (never
      # committed).  The ONLY step anywhere that contacts CelesTrak — and it
      # doesn't if the live site's copy is under 3½ hours old, so a burst of
      # pushes costs CelesTrak nothing.  A pull request never asks CelesTrak; a
      # scheduled refresh that CelesTrak fails stops here, before anything is built.  If nothing is fetched and nothing is live, the build
      # falls back to the snapshot committed with the code (tools/prepare-data.mjs).
      # What the fetch must remember between runs, whether or not a run deployed:
      #   • a CelesTrak hold — its rule for automated clients is to stop at the
      #     first answer that is not the data and tell a human, so one error
      #     answer means no requests for 24 hours;
      #   • when Space-Track was last asked — its limit is once an hour, and a
      #     run that fetched and then failed its tests would otherwise be
      #     followed by another fetch.
      # Both live in .fetch-state.json, carried in the Actions cache: restored
      # here (newest wins), saved below whenever the fetch writes it.
      - name: Restore what the last fetch left for this one
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: .fetch-state.json
          key: fetch-state-none
          restore-keys: fetch-state-
      - name: Get the satellite data this build will publish
        id: data
        run: |
          case "${{ github.event_name }}" in
            pull_request) node tools/fetch-data.mjs --no-celestrak ;;
            schedule)     node tools/fetch-data.mjs --scheduled ;;
            *)            node tools/fetch-data.mjs ;;
          esac
        env:
          # The Space-Track login (repository secrets; absent on forks and on
          # Dependabot's pull requests, where the fetch simply does without).
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
      - name: Remember it for later runs
        if: always() && steps.data.outputs.state == 'true'
        uses: actions/cache/save@v6
        with:
          path: .fetch-state.json
          key: fetch-state-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm test
      - run: npm run build
      - name: What was built
        run: |
          ls -la dist/missions/ && head -c 120 dist/missions/recent.json; echo
          ls -la dist/data/ && cat dist/data/meta.json
      # Hand the built site to the test jobs (one file: thousands of small files
      # make a slow artifact), and — on anything but a pull request — stage it
      # for Pages.  Staging is not publishing: the deploy job below needs every
      # test job to pass first.
      - run: tar -cf site.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site.tar
          retention-days: 1
      # enablement: true turns Pages on for the repo on the first run, so no
      # manual Settings → Pages toggle is needed.
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # The gate: the headless browser suites, run against the PRODUCTION build that
  # the build job just made — the very files, and the very satellite data, that
  # will be published — using the runner's preinstalled Chrome with software
  # WebGL.  They used to run one after another in the build job (about 17 of a
  # deploy's 22 minutes); here each has its own runner, so a deploy takes as long
  # as the slowest of them.
  #   desktop   scripts/smoke.mjs          the features, with a mouse
  #   phone     scripts/smoke-phone.mjs    an emulated Android phone, real taps, drags and pinches
  #   bad day   scripts/smoke-failures.mjs dependencies broken one at a time — data refusing or
  #             hanging, imagery blocked, workers crashing, the graphics context lost, no network,
  #             corrupt saved state, hostile links and data.  The longest suite, so it is split
  #             in two (SHARD=n/2 runs every second scenario).
  # Every suite fails if any page asks CelesTrak for anything.  dist/ is served by
  # scripts/serve-dist.mjs (a deliberately dumb static server — `vite preview` was
  # observed 404-ing real assets under browser Accept-Encoding headers).  One
  # retry absorbs a transient flake; two straight failures mean the build is
  # genuinely broken and the previous deploy stays live.
  test:
    needs: build
    name: test · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false   # let every suite report: one red run should say everything that is wrong
      matrix:
        include:
          - name: desktop
            run: node scripts/smoke.mjs
          - name: phone
            run: node scripts/smoke-phone.mjs
          - name: bad day (1 of 2)
            run: SHARD=1/2 node scripts/smoke-failures.mjs
          - name: bad day (2 of 2)
            run: SHARD=2/2 node scripts/smoke-failures.mjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site
      - run: tar -xf site.tar
      - name: Run the suite against the built site
        run: |
          google-chrome --version
          node scripts/serve-dist.mjs 4173 &
          JS=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          for i in $(seq 1 15); do
            curl -sf "http://localhost:4173/orbital/$JS" -o /dev/null && break
            sleep 1
          done
          for attempt in 1 2; do
            if SMOKE_URL=http://localhost:4173/orbital/ ${{ matrix.run }}; then exit 0; fi
            echo "attempt $attempt failed"
          done
          exit 1

  deploy:
    needs: [build, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Whichever attempt landed the deployment carries the live URL.
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # GitHub's Pages backend intermittently flips a healthy deployment to
      # "failure" ~15 s in, with an empty description — the SAME artifact and
      # config that deploys green on a re-run (verified: the failed deployments
      # had an identical waiting→queued→in_progress→terminal timing profile to
      # successful ones). actions/deploy-pages treats that terminal "failure" as
      # fatal and does NOT retry, so a good build was surfacing as a red run and
      # only a manual re-run fixed it. error_count only rides out transient
      # *polling* errors, not a definitive backend "failure" — so retry the
      # whole deploy up to 3× with a backoff. A transient flake now self-heals
      # inside the run; a genuine, persistent failure still fails the job.
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 600000           # 10 min ceiling (the action caps here anyway)
          error_count: 25           # tolerate transient status-poll errors
          reporting_interval: 10000 # poll every 10 s

      - name: Attempt 1 flaked — back off before retry
        if: steps.deploy1.outcome == 'failure'
        run: echo "Pages deploy attempt 1 returned a transient failure; waiting for the backend to settle." && sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 25
          reporting_interval: 10000

      - name: Attempt 2 flaked — back off before final retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: echo "Pages deploy attempt 2 also flaked; waiting before the final retry." && sleep 90
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5   # no continue-on-error: a third failure is real, let the run go red
        with:
          timeout: 600000
          error_count: 25
          reporting_interval: 10000

  # The data fetch can ask for a person's attention without stopping the deploy:
  # CelesTrak answered with an error (a 24-hour hold has started), or Space-Track
  # has delivered nothing for two days.  The site has already been published with
  # whatever fresh data there was; failing here makes GitHub email the owner.
  # The reason is in the "Get the satellite data" step of the build job.
  attention:
    needs: [build, deploy]
    if: needs.build.outputs.attention == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error title=Satellite data needs attention::See the 'Get the satellite data this build will publish' step of the build job for the reason. The site was still deployed."
          exit 1

