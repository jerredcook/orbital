name: Refresh satellite snapshot

# public/fallback/active.tle is CelesTrak's active-satellite list, saved in the
# repository: what laptop builds, forks and the test suites are built from, and
# the app's last resort.  Left alone it goes stale (it had drifted five months
# by November 2026), so once a week it is replaced with the copy the live site
# is serving (data/active.tle, which the deploy refreshes from CelesTrak every
# four hours).  This job makes no request to CelesTrak.
# The copy is validated first; if it is not a current, well-formed active list
# nothing is written, the job fails and the old snapshot stays.
# A push made with GITHUB_TOKEN does not trigger the deploy workflow, so it is
# dispatched explicitly — which still runs the full smoke gate.

on:
  schedule:
    - cron: '17 6 * * 1'   # every Monday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Copy the active list the live site is serving
        run: node tools/fetch-fallback-tle.mjs
      # The unit tests read this file.  Run them against the NEW one before it is
      # committed: a refresh that would break the build must fail here, in its own
      # run, and leave main — and every deploy after it — alone.  (On 16 November
      # 2026 a refreshed snapshot tripped a test and blocked deploys for half a day.)
      - name: Check the new snapshot against the unit tests
        run: |
          npm ci
          npm test
      - name: Commit and deploy if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet public/fallback/active.tle; then
            echo "snapshot unchanged — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fallback/active.tle
          git commit -m "Snapshot: refresh the bundled active-satellite list (automated)"
          git push
          gh workflow run "Deploy to GitHub Pages" --ref main
